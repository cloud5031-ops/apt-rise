name: Details History Backfill

# 최근 36개월 상세 거래 이력 백필 (수동 실행 전용).
# 개발계정 API 일일 한도(10,000콜)를 고려해 하루 1~2개 권역만 실행한다.
# 필요 시 start_month/end_month로 월 범위를 분할할 수 있다.

on:
  workflow_dispatch:
    inputs:
      region_group:
        description: '권역 그룹 선택'
        required: true
        default: 'seoul'
        type: choice
        options:
          - seoul
          - gyeonggi_incheon
          - metro
          - central
          - south
      start_month:
        description: '수집 시작월 YYYYMM (생략 시 anchor-35)'
        required: false
        default: ''
      end_month:
        description: '수집 끝월 YYYYMM (생략 시 잠정 집계월)'
        required: false
        default: ''
      resume:
        description: '장부에 기록된 시군구×월 건너뛰기'
        required: false
        default: true
        type: boolean

concurrency:
  group: apt-rise-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # GitHub의 6시간 하드캔슬(진행분이 통째로 유실된다)에 닿기 전에 끝낸다.
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 어느 브랜치에서 dispatch하든 항상 최신 main의 데이터 위에서 백필한다.
          # 오래된 브랜치를 checkout하면 그 사이 정기 갱신이 고친 상세 JSON과
          # 같은 파일을 다르게 수정하게 되어 push 단계의 rebase가 충돌한다.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Setup DB
        run: python scripts/db.py

      - name: Backfill Details History
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          ARGS="--region-group ${{ inputs.region_group }}"
          if [ -n "${{ inputs.start_month }}" ]; then ARGS="$ARGS --start-month ${{ inputs.start_month }}"; fi
          if [ -n "${{ inputs.end_month }}" ]; then ARGS="$ARGS --end-month ${{ inputs.end_month }}"; fi
          if [ "${{ inputs.resume }}" = "true" ]; then ARGS="$ARGS --resume"; fi
          python scripts/backfill_details_history.py $ARGS

      - name: Push Detail History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/details/
          git add data/details_backfill_state.json
          git commit -m "Backfill detail history (${{ inputs.region_group }})" || echo "No changes to commit"

          # 재시도 루프 (최대 3회)
          for i in {1..4}; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Push successful."
              break
            fi
            if [ $i -eq 4 ]; then
              echo "Push failed after 3 retries"
              exit 1
            fi
            echo "Push conflict, retrying in 5 seconds..."
            sleep 5
          done
