name: Nationwide Weekly Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
      timezone: 'Asia/Seoul'

concurrency:
  group: apt-rise-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nationwide-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Setup DB
        run: python scripts/db.py

      - name: Collect and Compute (Seoul)
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          rm -f data/apt.sqlite run_meta.json
          python scripts/db.py
          python scripts/collect_trades.py --region-group seoul
          python scripts/compute_apt_rankings.py --region-group seoul
          python scripts/export_details.py --region-group seoul || true

      - name: Collect and Compute (Gyeonggi Incheon)
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          rm -f data/apt.sqlite run_meta.json
          python scripts/db.py
          python scripts/collect_trades.py --region-group gyeonggi_incheon
          python scripts/compute_apt_rankings.py --region-group gyeonggi_incheon
          python scripts/export_details.py --region-group gyeonggi_incheon || true

      - name: Collect and Compute (Metro)
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          rm -f data/apt.sqlite run_meta.json
          python scripts/db.py
          python scripts/collect_trades.py --region-group metro
          python scripts/compute_apt_rankings.py --region-group metro
          python scripts/export_details.py --region-group metro || true

      - name: Collect and Compute (Central)
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          rm -f data/apt.sqlite run_meta.json
          python scripts/db.py
          python scripts/collect_trades.py --region-group central
          python scripts/compute_apt_rankings.py --region-group central
          python scripts/export_details.py --region-group central || true

      - name: Collect and Compute (South)
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          rm -f data/apt.sqlite run_meta.json
          python scripts/db.py
          python scripts/collect_trades.py --region-group south
          python scripts/compute_apt_rankings.py --region-group south
          python scripts/export_details.py --region-group south || true

      - name: Validate Shards
        run: python scripts/validate_shard.py

      - name: Merge Shards
        run: python scripts/merge_shards.py

      - name: Validate JSON
        run: python scripts/validate_json.py

      - name: Push Shards and National JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 배포 산출물 allowlist. capital-daily-refresh와 같은 안전장치를 쓴다.
          # data/details_backfill_state.json은 export_details.py가 매 실행 갱신하는
          # tracked 파일인데 여기서도 누락돼 있었다 (capital과 동일한 결함).
          # 진단용 data/apt.sqlite(gitignored)와 run_meta.json(untracked)은 제외한다.
          git add -- \
            data/shards \
            data/details_backfill_state.json \
            data/geocoding/apartment_coordinates.json \
            site/data/apt_rankings_*.json \
            site/data/details/*/*.json

          if git diff --cached --quiet; then
            echo "발행할 변경이 없습니다."
            exit 0
          fi

          git commit -m "Update nationwide apt rankings (Weekly Rollover)"

          # 커밋 후에도 tracked 변경이 남으면 allowlist가 산출물을 놓친 것이다.
          # stash로 감추면 원인이 다음 실행까지 이어지므로, 목록을 남기고 멈춘다.
          LEFTOVER="$(git status --porcelain --untracked-files=no)"
          if [ -n "$LEFTOVER" ]; then
            echo "::error::커밋되지 않은 tracked 변경이 남아 있습니다. publish allowlist를 확인하세요."
            echo "$LEFTOVER"
            {
              echo "### ❌ 발행 중단: allowlist 누락"
              echo ""
              echo '```'
              echo "$LEFTOVER"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # 수집이 오래 걸리는 동안 main이 전진할 수 있으므로 fetch/rebase는 여기 둔다.
          for i in {1..4}; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::origin/main 위로 rebase하지 못했습니다 (충돌). push하지 않습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi
            if [ "$i" -eq 4 ]; then
              echo "::error::Push failed after 3 retries"
              exit 1
            fi
            echo "Push rejected, retrying in 5 seconds..."
            sleep 5
          done
