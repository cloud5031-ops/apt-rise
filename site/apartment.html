<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아파트 실거래가 상세</title>
  <script src="/config.js"></script>
  <link rel="stylesheet" href="/index.css">
  <style>
    body { padding-top: 20px; padding-bottom: 50px; }
    .back-btn { font-size: 1rem; color: var(--sub); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: 600; cursor: pointer; }
    .back-btn:hover { color: var(--primary); }
    .header-section { margin-bottom: 20px; }
    .apt-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .apt-region { font-size: 0.9rem; color: var(--sub); }
    .collection-period { font-size: 0.8rem; color: var(--sub); margin-top: 4px; }
    
    .area-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    
    .nav-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; white-space: nowrap; }
    .nav-tabs button { background: none; border: none; font-size: 1rem; font-weight: 600; color: var(--sub); padding: 8px 4px; border-bottom: 2px solid transparent; cursor: pointer; }
    .nav-tabs button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    table.trades-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    .trades-table th { color: var(--sub); padding: 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .trades-table td { padding: 12px 8px; border-bottom: 1px solid var(--border); }
    .trades-table tr:hover { background: rgba(0,0,0,0.02); }
    
    .direct-deal { display: inline-block; background: var(--border); color: var(--sub); font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; margin-left: 4px; }
    
    .error-box { padding: 40px 20px; text-align: center; color: var(--sub); background: var(--card-bg); border-radius: 12px; margin-top: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div onclick="goBack()" class="back-btn">&larr; 목록으로 돌아가기</div>
  
  <div id="loading" style="text-align:center; padding: 40px; color: var(--sub);">로딩 중...</div>
  <div id="error-view" class="error-box" style="display:none;"></div>
  
  <div id="content-view" style="display:none;">
    <div class="header-section">
      <h1 class="apt-title" id="apt-name">단지명</h1>
      <div class="apt-region" id="apt-address">지역 정보</div>
      <div class="collection-period" id="apt-period">수집 기간: </div>
    </div>
    
    <div style="font-weight:600; margin-bottom:8px;">평형 선택</div>
    <div class="area-filters" id="area-filters"></div>
    
    <div class="nav-tabs">
      <button class="tab-btn active" data-target="tab-trades">거래 내역</button>
      <button class="tab-btn" data-target="tab-trends">가격 추이</button>
      <button class="tab-btn" data-target="tab-location">위치</button>
    </div>
    
    <div id="tab-trades" class="tab-content active">
      <table class="trades-table">
        <thead>
          <tr>
            <th>계약일</th>
            <th>거래가격</th>
            <th>층</th>
            <th>전용면적</th>
          </tr>
        </thead>
        <tbody id="trades-body"></tbody>
      </table>
      <div id="no-trades" style="display:none; text-align:center; padding: 20px; color: var(--sub);">선택한 평형의 유효한 거래 내역이 없습니다.</div>
    </div>
    
    
    <div id="tab-trends" class="tab-content">
      <div style="background:var(--card-bg); padding:16px; border-radius:12px; margin-bottom:20px;">
        <h3 style="font-size:1.1rem; margin-bottom:4px;">실거래 가격 추이</h3>
        <p style="font-size:0.75rem; color:var(--sub); margin-bottom:12px;">공식 시세가 아니라 실제 신고 거래 표본을 이용한 값입니다.</p>
        <div id="chart-error-scatter" style="display:none; color:var(--sub); text-align:center; padding:20px;">그래프를 불러올 수 없습니다.</div>
        <div class="chart-container" style="position: relative; height:250px; width:100%;">
          <canvas id="scatterChart"></canvas>
        </div>
      </div>
      
      <div style="background:var(--card-bg); padding:16px; border-radius:12px;">
        <h3 style="font-size:1.1rem; margin-bottom:4px;">월별 실거래 중위가격</h3>
        <p style="font-size:0.75rem; color:var(--sub); margin-bottom:12px;">공식 시세가 아니라 실제 신고 거래 표본을 이용한 값입니다.</p>
        <div id="chart-error-monthly" style="display:none; color:var(--sub); text-align:center; padding:20px;">그래프를 불러올 수 없습니다.</div>
        <div class="chart-container" style="position: relative; height:250px; width:100%;">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>
    </div>

    <div id="tab-location" class="tab-content">
      <div style="background:var(--card-bg); padding:16px; border-radius:12px;">
        <h3 style="font-size:1.1rem; margin-bottom:4px;">단지 위치</h3>
        <p style="font-size:0.75rem; color:var(--sub); margin-bottom:12px;">지도를 이동하거나 축소/확대할 수 있습니다.</p>
        <div id="map-error" style="display:none; color:var(--sub); text-align:center; padding:20px;">지도 정보를 불러올 수 없습니다.</div>
        <div id="map-container" style="width:100%; min-height:400px; border-radius:8px; overflow:hidden;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let aptData = null;
  let selectedArea = null;
  
  const urlParams = new URLSearchParams(window.location.search);
  const aptKey = urlParams.get('key');
  
  function goBack() {
    window.location.href = 'index.html';
  }
  
  function parseToValidDate(dStr) {
    if (!dStr) return null;
    let s = String(dStr).trim();
    if (s.length === 8 && !s.includes('-') && !s.includes('.')) {
      s = s.substring(0,4) + '-' + s.substring(4,6) + '-' + s.substring(6,8);
    } else if (s.includes('.')) {
      s = s.replace(/\./g, '-');
    }
    const d = new Date(s);
    if (isNaN(d.getTime())) return null;
    return d;
  }

  function formatDate(dStr) {
    const d = parseToValidDate(dStr);
    if (!d) return String(dStr);
    return `${d.getFullYear()}.${(d.getMonth()+1).toString().padStart(2,'0')}.${d.getDate().toString().padStart(2,'0')}`;
  }
  
  function getPriceWon(t) {
    if (t.priceWon !== undefined) return Number(t.priceWon);
    if (t.price !== undefined && aptData.priceUnit === "KRW") return Number(t.price);
    if (t.price !== undefined) return Number(t.price) * 10000;
    return 0;
  }

  function formatPrice(priceWon) {
    if (!priceWon || isNaN(priceWon) || priceWon <= 0) return "-";
    let eok = Math.floor(priceWon / 100000000);
    let man = Math.floor((priceWon % 100000000) / 10000);
    if (eok > 0 && man > 0) return `${eok}억 ${man.toLocaleString()}만`;
    if (eok > 0) return `${eok}억`;
    return `${man.toLocaleString()}만`;
  }
  
  async function loadData() {
    if (!aptKey) {
      showError("아파트 식별자가 전달되지 않았습니다.");
      return;
    }
    
    const parts = aptKey.split('-');
    if (parts.length < 2) {
      showError("잘못된 아파트 식별자입니다.");
      return;
    }
    const sgg = parts[0];
    
    try {
      const res = await fetch(`/data/details/${sgg}/${aptKey}.json?v=${new Date().getTime()}`);
      if (!res.ok) throw new Error("데이터 없음");
      aptData = await res.json();
      
      if (!aptData.availableAreas || aptData.availableAreas.length === 0) {
        showError("수집된 거래 면적 정보가 없습니다.");
        return;
      }
      
      // Filter valid areas
      const validAreas = aptData.availableAreas.filter(a => a !== null && a !== undefined && a !== '' && !isNaN(Number(a)) && Number(a) > 0);
      aptData.availableAreas = [...new Set(validAreas)].map(Number).sort((a,b) => a - b);
      
      if (aptData.availableAreas.length === 0) {
        showError("유효한 면적 정보가 없습니다.");
        return;
      }
      
      // select first area by default
      selectedArea = aptData.availableAreas[0];
      renderHeader();
      renderAreaFilters();
      renderTrades();
        renderCharts();
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content-view').style.display = 'block';
    } catch (e) {
      console.error(e);
      showError("해당 단지의 상세 데이터를 불러올 수 없습니다. (순위 밖이거나 오류 발생)");
    }
  }
  
  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const ev = document.getElementById('error-view');
    ev.style.display = 'block';
    ev.innerHTML = `<h3>안내</h3><p>${msg}</p>`;
  }
  
  function renderHeader() {
    document.getElementById('apt-name').innerText = aptData.apartmentName;
    
    // Convert SGG code to readable name if possible
    // Note: In real implementation we'd use SGG_CODE_MAP from index.html
    const addr = `${aptData.sggCode} ${aptData.dongName}`; // simplified
    document.getElementById('apt-address').innerText = addr;
    
    const periods = aptData.referenceMonths || [];
    document.getElementById('apt-period').innerText = `수집 기준월: ${periods.join(', ')}`;
  }
  
  function renderAreaFilters() {
    const container = document.getElementById('area-filters');
    container.innerHTML = '';
    
    aptData.availableAreas.forEach(area => {
      const btn = document.createElement('button');
      btn.className = `chip ${selectedArea === area ? 'active' : ''}`;
      // In CSS .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
      btn.innerText = `${area}㎡`;
      if (selectedArea === area) {
        btn.style.background = 'var(--primary)';
        btn.style.color = '#fff';
      }
      
      btn.onclick = () => {
        selectedArea = area;
        renderAreaFilters();
        renderTrades();
        renderCharts();
      };
      container.appendChild(btn);
    });
  }
  
  function renderTrades() {
    const tbody = document.getElementById('trades-body');
    tbody.innerHTML = '';
    
    // Filter transactions: area matches, and NOT cancelled
    const validTrades = (aptData.transactions || []).filter(t => 
      t.exclusiveArea === selectedArea && t.cancellationStatus !== 'CANCELLED'
    );
    
    if (validTrades.length === 0) {
      document.getElementById('no-trades').style.display = 'block';
      document.querySelector('.trades-table').style.display = 'none';
      return;
    }
    
    document.getElementById('no-trades').style.display = 'none';
    document.querySelector('.trades-table').style.display = 'table';
    
    validTrades.forEach(t => {
      const tr = document.createElement('tr');
      
      const dealTypeBadge = t.dealType === '직거래' ? `<span class="direct-deal">직거래</span>` : '';
      
      tr.innerHTML = `
        <td>${formatDate(t.contractDate || t.dealDate)}</td>
        <td style="font-weight:600; color:var(--ink);">${formatPrice(getPriceWon(t))}${dealTypeBadge}</td>
        <td>${t.floor}층</td>
        <td>${t.exclusiveArea}㎡</td>
      `;
      tbody.appendChild(tr);
    });
  }
  
  // Tab handling
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      e.target.classList.add('active');
      document.getElementById(e.target.dataset.target).classList.add('active');
      
      if (e.target.dataset.target === 'tab-location') {
        loadKakaoMap();
        if (mapInst) {
           setTimeout(() => {
               mapInst.relayout();
               let l1 = null, l2 = null;
               if (aptData.location && Number.isFinite(Number(aptData.location.latitude))) {
                   l1 = Number(aptData.location.latitude); l2 = Number(aptData.location.longitude);
               } else { l1 = Number(aptData.lat); l2 = Number(aptData.lng); }
               mapInst.setCenter(new kakao.maps.LatLng(l1, l2));
           }, 100);
        }
      }
    });
  });
  
  
  let chartJsLoaded = false;
  let scatterChartInst = null;
  let monthlyChartInst = null;
  
  function loadChartJs() {
    return new Promise((resolve, reject) => {
      if (window.Chart) return resolve();
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
      script.onload = () => { chartJsLoaded = true; resolve(); };
      script.onerror = () => reject(new Error('Chart.js CDN failed'));
      document.head.appendChild(script);
    });
  }

  async function renderCharts() {
    try {
      await loadChartJs();
    } catch (e) {
      document.getElementById('chart-error-scatter').style.display = 'block';
      document.getElementById('chart-error-monthly').style.display = 'block';
      document.querySelectorAll('.chart-container').forEach(c => c.style.display = 'none');
      return;
    }
    
    document.getElementById('chart-error-scatter').style.display = 'none';
    document.getElementById('chart-error-monthly').style.display = 'none';
    document.querySelectorAll('.chart-container').forEach(c => c.style.display = 'block');
    
    const validTrades = (aptData.transactions || []).filter(t => 
      t.exclusiveArea === selectedArea && t.cancellationStatus !== 'CANCELLED'
    );
    
    if (scatterChartInst) scatterChartInst.destroy();
    if (monthlyChartInst) monthlyChartInst.destroy();
    
    if (validTrades.length === 0) {
       document.getElementById('chart-error-scatter').innerText = "해당 평형의 유효한 거래가 없어 그래프를 표시할 수 없습니다.";
       document.getElementById('chart-error-monthly').innerText = "해당 평형의 유효한 거래가 없어 그래프를 표시할 수 없습니다.";
       document.getElementById('chart-error-scatter').style.display = 'block';
       document.getElementById('chart-error-monthly').style.display = 'block';
       document.querySelectorAll('.chart-container').forEach(c => c.style.display = 'none');
       return;
    }
    
    // 1. Chart Data Prep
    let minPrice = Infinity, maxPrice = -Infinity;
    const scatterData = [];
    const monthlyGroups = {};
    
    validTrades.forEach(t => {
      const p = getPriceWon(t);
      const d = parseToValidDate(t.contractDate || t.dealDate);
      
      if (!d || isNaN(p) || p <= 0 || t.cancellationStatus === 'CANCELLED') {
         if (!d) console.warn("Invalid date:", t.contractDate);
         return;
      }
      
      scatterData.push({ x: d.getTime(), y: p, raw: t });
      if (p < minPrice) minPrice = p;
      if (p > maxPrice) maxPrice = p;
      
      const mKey = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
      if(!monthlyGroups[mKey]) monthlyGroups[mKey] = [];
      monthlyGroups[mKey].push(p);
    });
    
    if (scatterData.length === 0) {
      document.getElementById('chart-container').innerHTML = '<div style="text-align:center; padding:40px; color:var(--sub);">선택한 평형의 유효한 거래 데이터가 없습니다.</div>';
      return;
    }
    
    const yMax = maxPrice * 1.05;
    const yMin = minPrice * 0.95;
    
    const agencyTrades = scatterData.filter(d => d.raw.dealType !== '직거래');
    const directTrades = scatterData.filter(d => d.raw.dealType === '직거래');
    
    const scatterCtx = document.getElementById('scatterChart').getContext('2d');
    scatterChartInst = new Chart(scatterCtx, {
      type: 'scatter',
      data: {
        datasets: [
          {
            label: '중개거래',
            data: agencyTrades,
            backgroundColor: '#2563c9',
            pointRadius: 5,
            pointHoverRadius: 7
          },
          {
            label: '직거래',
            data: directTrades,
            backgroundColor: '#d6293e',
            pointStyle: 'rectRot',
            pointRadius: 6,
            pointHoverRadius: 8
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const t = ctx.raw.raw;
                return `${formatDate(t.contractDate || t.dealDate)} | ${formatPrice(getPriceWon(t))} | ${t.floor}층 | ${t.dealType}`;
              }
            }
          }
        },
        scales: {
          x: {
            type: 'linear',
            ticks: {
              callback: function(val) {
                const d = new Date(val);
                return `${d.getFullYear()}.${(d.getMonth()+1).toString().padStart(2,'0')}`;
              }
            }
          },
          y: {
            max: yMax,
            min: yMin,
            ticks: {
              callback: function(val) {
                return formatPrice(val);
              }
            }
          }
        }
      }
    });
    
    // 2. Monthly Median Chart Data
    const months = Object.keys(monthlyGroups).sort();
    const medians = [];
    const volumes = [];
    
    months.forEach(m => {
      const prices = monthlyGroups[m].sort((a,b) => a - b);
      let med = 0;
      const len = prices.length;
      if (len % 2 === 0) med = (prices[len/2 - 1] + prices[len/2]) / 2;
      else med = prices[Math.floor(len/2)];
      
      medians.push(med);
      volumes.push(len);
    });
    
    const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
    monthlyChartInst = new Chart(monthlyCtx, {
      type: 'line',
      data: {
        labels: months.map(m => `${m.substring(0,4)}.${m.substring(4,6)}`),
        datasets: [
          {
            type: 'line',
            label: '실거래 중위가격',
            data: medians,
            borderColor: '#2563c9',
            backgroundColor: '#2563c9',
            yAxisID: 'y',
            tension: 0.1,
            pointRadius: 4
          },
          {
            type: 'bar',
            label: '거래 건수',
            data: volumes,
            backgroundColor: 'rgba(107, 118, 132, 0.3)',
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          tooltip: {
            callbacks: {
              label: (ctx) => {
                if (ctx.datasetIndex === 0) {
                    return `실거래 중위가격: ${formatPrice(ctx.raw)}`;
                }
                return `거래 건수: ${ctx.raw}건`;
              },
              afterLabel: (ctx) => {
                if (ctx.datasetIndex === 0) {
                  // Median price tooltip
                  const idx = ctx.dataIndex;
                  if (idx > 0) {
                    const prev = medians[idx-1];
                    const cur = medians[idx];
                    const rate = ((cur - prev) / prev * 100).toFixed(2);
                    // Check sample size (if either month has < 2 trades, rate is unstable)
                    // But requirement says: "월별 표본이 부족한 경우: 변화율은 '표본 부족'으로 표시"
                    if (volumes[idx-1] < 2 || volumes[idx] < 2) {
                      return `실거래 중위가격 변화율: 표본 부족`;
                    }
                    return `실거래 중위가격 변화율: ${rate > 0 ? '+' : ''}${rate}%`;
                  }
                  return '';
                }
              }
            }
          }
        },
        scales: {
          y: {
            type: 'linear',
            display: true,
            position: 'left',
            max: yMax,
            min: yMin,
            ticks: {
              callback: function(val) {
                return formatPrice(val);
              }
            }
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            grid: { drawOnChartArea: false },
            min: 0,
            ticks: {
              stepSize: 1
            }
          }
        }
    });
  }

  
  let mapLoaded = false;
  let mapLoading = false;
  let mapInst = null;
  
  function showMapError(reason, msg) {
    console.error(`Map Load Failed: ${reason}`);
    document.getElementById('map-error').innerText = msg;
    document.getElementById('map-error').style.display = 'block';
    document.getElementById('map-container').style.display = 'none';
    mapLoaded = true;
  }
  
  function loadKakaoMap() {
    if (mapLoaded || mapLoading) return;
    
    if (!window.APP_CONFIG) {
       showMapError('config_missing', '설정 파일을 불러올 수 없습니다.');
       return;
    }
    
    const key = window.APP_CONFIG.kakaoMapJavaScriptKey;
    if (!key || key.trim() === '' || key === '__KAKAO_JAVASCRIPT_KEY__') {
       showMapError('javascript_key_missing', '지도 API 키가 설정되지 않았습니다.');
       return;
    }

    let lat = null, lng = null;
    if (aptData.location && Number.isFinite(Number(aptData.location.latitude))) {
        lat = Number(aptData.location.latitude);
        lng = Number(aptData.location.longitude);
    } else if (Number.isFinite(Number(aptData.lat))) {
        lat = Number(aptData.lat);
        lng = Number(aptData.lng);
    }

    if (!lat || !lng) {
      showMapError('coordinates_missing', '지도에 표시할 단지 좌표 정보가 없습니다.');
      return;
    }
    
    mapLoading = true;
    
    const script = document.createElement('script');
    script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false`;
    
    script.onload = () => {
      kakao.maps.load(() => {
        try {
            const container = document.getElementById('map-container');
            const pos = new kakao.maps.LatLng(lat, lng);
            const options = { center: pos, level: 3 };
            mapInst = new kakao.maps.Map(container, options);
            
            const marker = new kakao.maps.Marker({ position: pos });
            marker.setMap(mapInst);
            
            const overlayContent = `<div style="padding:4px 8px; background:var(--ink); color:#fff; border-radius:4px; font-size:0.75rem; font-weight:bold; white-space:nowrap; transform:translateY(-150%);">${aptData.apartmentName}</div>`;
            const customOverlay = new kakao.maps.CustomOverlay({
                position: pos,
                content: overlayContent,
                yAnchor: 1
            });
            customOverlay.setMap(mapInst);
            
            mapLoaded = true;
            mapLoading = false;
        } catch (e) {
            mapLoading = false;
            showMapError('map_init_failed', '지도 초기화 중 오류가 발생했습니다.');
        }
      });
    };
    script.onerror = () => {
      mapLoading = false;
      showMapError('kakao_sdk_failed', '지도 SDK를 불러올 수 없습니다. 도메인 허용 설정이나 네트워크를 확인해 주세요.');
    };
    document.head.appendChild(script);
  }

  window.onload = loadData;
</script>
</body>
</html>
